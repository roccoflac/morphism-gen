[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphism-gen"
version = "0.1.0"
description = "Standalone Material You theme generator with caelestia-exact colour extraction and user-defined templates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "roccoflac" }]
dependencies = [
    "materialyoucolor>=3.0.4,<4",
    "pillow>=12",
]

[project.scripts]
morphism-gen = "morphism_gen.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
morphism_gen = ["templates/*"]
